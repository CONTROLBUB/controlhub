<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ControlHub | Gestão Inteligente de Frotas</title>

<meta name="description" content="Controle completo da sua frota com dashboard, agendamentos, documentos e custos.">

<link rel="icon" type="image/png" href="favicon.png">

<style>
body{margin:0;font-family:Segoe UI;background:#071015;color:#fff}
header{display:flex;justify-content:space-between;padding:20px 40px;align-items:center}
header img{height:45px}
.btn{background:#25D366;padding:10px 18px;border-radius:8px;color:#fff;text-decoration:none;font-weight:bold}
.hero{padding:80px 40px}
.hero h1{font-size:48px}
.dashboard{display:flex;gap:20px;padding:40px}
.card{flex:1;background:#0c2433;padding:20px;border-radius:12px}
.menu{position:fixed;left:0;top:0;height:100%;width:220px;background:#08131b;padding:20px}
.menu button{display:block;width:100%;margin-bottom:10px;padding:10px;border:0;background:#0c2433;color:#fff;border-radius:8px;cursor:pointer}
.page{display:none;padding:40px;margin-left:240px}
.active{display:block}
</style>
</head>

<body>

<div class="menu">
  <img src="logo.png" style="width:100%;margin-bottom:20px">
  <button onclick="show('dash')">Dashboard</button>
  <button onclick="show('frota')">Frota</button>
  <button onclick="show('agenda')">Agendamentos</button>
  <button onclick="show('docs')">Documentos</button>
</div>

<div class="page active" id="dash">
  <h1>Dashboard</h1>
  <div class="dashboard">
    <div class="card">Revisão imediata: 7</div>
    <div class="card">Em atenção: 12</div>
    <div class="card">OK: 38</div>
  </div>
</div>

<div class="page" id="frota">
  <h1>Frota</h1>
  <p>Lista de veículos controlados</p>
</div>

<div class="page" id="agenda">
  <h1>Agendamentos</h1>
  <p>Controle de manutenção</p>
</div>

<div class="page" id="docs">
  <h1>Documentos</h1>
  <p>CRLV e Tacógrafo</p>
</div>

<script>
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
  document.getElementById(id).classList.add('active')
}
</script>

</body>
</html>
